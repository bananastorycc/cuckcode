<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6ead8"/><stop offset="1" stop-color="#e4cfb2"/>
    </linearGradient>
    <linearGradient id="carpet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8c3b36"/><stop offset="1" stop-color="#6e2a27"/>
    </linearGradient>
    <linearGradient id="velvet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a837c"/><stop offset="1" stop-color="#235a55"/>
    </linearGradient>
    <linearGradient id="velvetLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a9a92"/><stop offset="1" stop-color="#2c6b65"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a6863"/><stop offset=".5" stop-color="#3f8d86"/><stop offset="1" stop-color="#2a6863"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a4b28"/><stop offset="1" stop-color="#4f2f17"/>
    </linearGradient>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <filter id="drop" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <g filter="url(#drop)">
    <g clip-path="url(#squircle)">
      <rect x="100" y="100" width="824" height="824" fill="url(#wall)"/>
      <rect x="100" y="742" width="824" height="182" fill="url(#carpet)"/>
      <rect x="100" y="736" width="824" height="10" fill="#c9ad88"/>
    </g>
  </g>

  <!-- floor shadow -->
  <ellipse cx="512" cy="822" rx="300" ry="30" fill="#000" opacity=".28"/>

  <!-- back legs -->
  <path d="M352 730 h34 l-6 78 h-22 z" fill="url(#wood)"/>
  <path d="M638 730 h34 l-6 78 h-22 z" fill="url(#wood)"/>

  <!-- backrest -->
  <path d="M322 610 V330 Q322 250 402 250 H622 Q702 250 702 330 V610 Z" fill="url(#velvet)"/>
  <path d="M352 600 V345 Q352 282 412 282 H612 Q672 282 672 345 V600 Z" fill="url(#velvetLight)" opacity=".55"/>
  <!-- tufting -->
  <g fill="#1b4642">
    <circle cx="432" cy="360" r="9"/><circle cx="512" cy="360" r="9"/><circle cx="592" cy="360" r="9"/>
    <circle cx="472" cy="440" r="9"/><circle cx="552" cy="440" r="9"/>
    <circle cx="432" cy="520" r="9"/><circle cx="512" cy="520" r="9"/><circle cx="592" cy="520" r="9"/>
  </g>

  <!-- base / skirt -->
  <rect x="292" y="628" width="440" height="116" rx="34" fill="url(#velvet)"/>
  <rect x="292" y="716" width="440" height="10" fill="#1b4642" opacity=".5"/>

  <!-- seat cushion -->
  <rect x="336" y="572" width="352" height="84" rx="32" fill="url(#velvetLight)"/>
  <path d="M350 590 Q512 570 674 590" stroke="#5fb0a7" stroke-width="6" fill="none" opacity=".5" stroke-linecap="round"/>

  <!-- arms -->
  <rect x="262" y="458" width="110" height="282" rx="50" fill="url(#arm)"/>
  <rect x="652" y="458" width="110" height="282" rx="50" fill="url(#arm)"/>
  <ellipse cx="317" cy="478" rx="44" ry="18" fill="#5fb0a7" opacity=".45"/>
  <ellipse cx="707" cy="478" rx="44" ry="18" fill="#5fb0a7" opacity=".45"/>

  <!-- front legs -->
  <path d="M300 738 h42 l-8 92 h-26 z" fill="url(#wood)"/>
  <path d="M682 738 h42 l-8 92 h-26 z" fill="url(#wood)"/>
</svg>
